exclude: ^vendored/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # These generated fixtures need enough references to expose quadratic CPU growth.
        exclude: ^define/testdata/compiler_resources/reference_depth_updates(_control)?_project/lib/pkg0/m0\.dfn$
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ".*carriage_return.*"
      - id: name-tests-test
      - id: trailing-whitespace
        exclude: ".*trailing_space.*"
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: basedpyright
        name: basedpyright
        entry: tools/pyright-precommit.sh
        exclude: define/compiler/prototype
        language: system
        types: [python]

      - id: bazel-checks
        name: bazel-based checks
        entry:
          bazelisk test --noshow_progress
          //define/proposals:validate_proposals_test
          //defcl/proposals:validate_proposals_test
          //tools:sync_agent_permissions_test
        language: system
        types_or: [markdown, json]
        pass_filenames: false

      - id: python-deps
        name: fix Python BUILD dependencies
        entry: uv run tools/check_python_deps.py
        language: system
        files: (^|/)(BUILD\.bazel|.*\.pyi?)$

      - id: rust-checks
        name: Rust lint and format checks
        entry:
          bazelisk test --noshow_progress
          //define/compiler/codegen/literal/python:clippy_test
          //define/compiler/codegen/literal/python:rustfmt_test
        language: system
        files: (\.rs|\.j2|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$
        pass_filenames: false

      - id: format
        name: reformat files
        entry: bazelisk run --noshow_progress //tools:format --
        language: system
        pass_filenames: false
        require_serial: true

      - id: buf-plugin-build
        name: build buf plugin
        entry: bazelisk build --noshow_progress //defcl/buf
        language: system
        files: (^defcl/buf.*)|^defcl/.*\.proto$|^define/.*\.proto$
        pass_filenames: false
  - repo: https://github.com/bufbuild/buf
    rev: v1.73.0
    hooks:
      - id: buf-lint
        files: (^defcl/buf.*)|^defcl/.*\.proto$|^define/.*\.proto$
        args: []
