repos:
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.2.1.1
    hooks:
      - id: buildifier
      - id: buildifier-lint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: "defcl/testdata/invalid/syntax/whitespace/carriage_return.defcl"
      - id: name-tests-test
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --check
        language: system
        types_or: [markdown, yaml]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check --diff
        language: system
        types: [python]

      - id: basedpyright
        name: basedpyright
        entry: tools/pyright-precommit.sh
        exclude: define/compiler/prototype
        language: system
        types: [python]

      - id: bazel-checks
        name: bazel-based checks
        entry:
          bazelisk test //define/proposals:validate_proposals_test
          //defcl/proposals:validate_proposals_test
          //tools:sync_cursor_permissions_test
        language: system
        types_or: [markdown, json]
        pass_filenames: false

      - id: buf-plugin-build
        name: build buf plugin
        entry: bazelisk build //defcl/buf
        language: system
        files: (^defcl/buf.*)|^defcl/.*\.proto$
        pass_filenames: false
  - repo: https://github.com/bufbuild/buf
    rev: v1.65.0
    hooks:
      - id: buf-lint
        files: (^defcl/buf.*)|^defcl/.*\.proto$
        args: ["--config=defcl/buf.yaml"]
      - id: buf-format
        files: ^.*\.proto$
