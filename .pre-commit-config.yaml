exclude: ^vendored/

# File-changing hooks need separate priorities so they cannot race on the same files.
repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        priority: 50
        # These generated fixtures need enough input to expose quadratic CPU growth.
        exclude: ^define/testdata/compiler_resources/([^/]+|reference_depth_updates(_control)?_project/lib/pkg0/m0)\.dfn$
      - id: check-case-conflict
        priority: 50
      - id: check-illegal-windows-names
        priority: 50
      - id: check-json
        priority: 50
      - id: check-merge-conflict
        priority: 50
      - id: check-toml
        priority: 50
      - id: check-yaml
        priority: 50
      - id: destroyed-symlinks
        priority: 50
      - id: mixed-line-ending
        priority: 0
        args: ["--fix=lf"]
        exclude: ".*carriage_return.*"
      - id: trailing-whitespace
        priority: 10
        # Blank context lines in patches are a single space.
        exclude: ".*trailing_space.*|\\.patch$"
  - repo: local
    hooks:
      - id: ruff-check
        priority: 20
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: check-all-symlinks
        priority: 50
        name: check that no tracked symlink is broken
        # Checks every tracked symlink, because a change can remove the
        # target of a symlink that the change does not touch.
        entry: uv run tools/check_symlinks.py
        language: system
        always_run: true
        pass_filenames: false

      - id: python-deps
        priority: 30
        name: fix Python BUILD dependencies
        entry: uv run tools/check_python_deps.py
        language: system
        files: (^|/)(BUILD\.bazel|.*\.pyi?)$
        # Different filename batches can update the same BUILD file.
        require_serial: true

      - id: bazel-checks
        # This hook formats files, and it builds the plugin that buf-lint
        # loads from bazel-bin.
        priority: 40
        name: Bazel checks and formatting
        entry: uv run tools/precommit_bazel_checks.py
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/bufbuild/buf
    rev: v1.75.0
    hooks:
      - id: buf-lint
        priority: 60
        files: (^defcl/buf.*)|^defcl/.*\.proto$|^define/.*\.proto$
        args: []
