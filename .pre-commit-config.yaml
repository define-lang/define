repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ".*carriage_return.*"
      - id: name-tests-test
      - id: trailing-whitespace
        exclude: ".*trailing_space.*"
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: basedpyright
        name: basedpyright
        entry: tools/pyright-precommit.sh
        exclude: define/compiler/prototype
        language: system
        types: [python]

      - id: bazel-checks
        name: bazel-based checks
        entry:
          bazelisk test --noshow_progress
          //define/proposals:validate_proposals_test
          //defcl/proposals:validate_proposals_test
          //tools:sync_agent_permissions_test
        language: system
        types_or: [markdown, json]
        pass_filenames: false

      - id: format
        name: reformat files
        entry: bazelisk run --noshow_progress //tools:format --
        language: system
        require_serial: true

      - id: buf-plugin-build
        name: build buf plugin
        entry: bazelisk build --noshow_progress //defcl/buf
        language: system
        files: (^defcl/buf.*)|^defcl/.*\.proto$|^define/.*\.proto$
        pass_filenames: false
  - repo: https://github.com/bufbuild/buf
    rev: v1.66.0
    hooks:
      - id: buf-lint
        files: (^defcl/buf.*)|^defcl/.*\.proto$|^define/.*\.proto$
        args: []
