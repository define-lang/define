exclude: ^vendored/

# File-changing hooks need separate priorities so they cannot race on the same files.
# Bazel hooks also need separate priorities because they share one server.
repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        priority: 50
        # These generated fixtures need enough input to expose quadratic CPU growth.
        exclude: ^define/testdata/compiler_resources/([^/]+|reference_depth_updates(_control)?_project/lib/pkg0/m0)\.dfn$
      - id: check-case-conflict
        priority: 50
      - id: check-illegal-windows-names
        priority: 50
      - id: check-json
        priority: 50
      - id: check-merge-conflict
        priority: 50
      - id: check-toml
        priority: 50
      - id: check-yaml
        priority: 50
      - id: destroyed-symlinks
        priority: 50
      - id: mixed-line-ending
        priority: 0
        args: ["--fix=lf"]
        exclude: ".*carriage_return.*"
      - id: trailing-whitespace
        priority: 10
        exclude: ".*trailing_space.*"
  - repo: local
    hooks:
      - id: ruff-check
        priority: 20
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: basedpyright
        priority: 60
        name: basedpyright
        entry: tools/pyright-precommit.sh
        exclude: define/compiler/prototype
        language: system
        types: [python]
        require_serial: true

      - id: bazel-checks
        priority: 70
        name: bazel-based checks
        entry:
          bazelisk test --noshow_progress
          //define/proposals:validate_proposals_test
          //defcl/proposals:validate_proposals_test
          //define/standard/proposals:validate_proposals_test
          //tools:sync_agent_permissions_test
        language: system
        types_or: [markdown, json]
        pass_filenames: false

      - id: check-all-symlinks
        priority: 50
        name: check that no tracked symlink is broken
        # Checks every tracked symlink, because a change can remove the
        # target of a symlink that the change does not touch.
        entry: uv run tools/check_symlinks.py
        language: system
        always_run: true
        pass_filenames: false

      - id: python-deps
        priority: 30
        name: fix Python BUILD dependencies
        entry: uv run tools/check_python_deps.py
        language: system
        files: (^|/)(BUILD\.bazel|.*\.pyi?)$
        # Different filename batches can update the same BUILD file.
        require_serial: true

      - id: build-file-checks
        priority: 90
        name: check that BUILD files call check_build_file
        entry:
          bazelisk run --noshow_progress @multitool//tools/ast-grep:cwd -- scan
        language: system
        files: (^|/)BUILD\.bazel$
        exclude: ^vendored/

      - id: rust-checks
        priority: 80
        name: Rust lint checks
        entry:
          bazelisk test --noshow_progress
          //define/compiler/codegen/literal/python:clippy_test
        language: system
        files: (\.rs|\.j2|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$
        pass_filenames: false

      - id: format
        priority: 40
        name: reformat files
        entry: bazelisk run --noshow_progress //:format
        language: system
        pass_filenames: false
        require_serial: true

      - id: buf-plugin-build
        priority: 50
        name: build buf plugin
        entry: bazelisk build --noshow_progress //defcl/buf
        language: system
        files: (^defcl/buf.*)|^defcl/.*\.proto$|^define/.*\.proto$
        pass_filenames: false
  - repo: https://github.com/bufbuild/buf
    rev: v1.74.0
    hooks:
      - id: buf-lint
        priority: 60
        files: (^defcl/buf.*)|^defcl/.*\.proto$|^define/.*\.proto$
        args: []
