repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --check
        language: system
        types_or: [markdown, yaml]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check --diff
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]

      - id: validate-proposals
        name: validate proposals
        entry: uv run python scripts/validate_proposals.py
        language: system
        types: [markdown]
        files: ^(proposals|defcl/proposals)/(.*/)?\d{5}-.*\.md$

      - id: check-cursor-permissions
        name: check cursor permissions
        entry: uv run python scripts/sync_cursor_permissions.py --check
        language: system
        files: ^\.claude/settings\.json$|^\.cursor/cli\.json$
        pass_filenames: false

      - id: buf-lint
        name: buf lint
        entry: npx @bufbuild/buf lint defcl/schema
        language: system
        types: [proto]
        pass_filenames: false

      - id: buf-format-check
        name: buf format check
        entry: npx @bufbuild/buf format defcl --diff --exit-code
        language: system
        types: [proto]
        pass_filenames: false
