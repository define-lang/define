repos:
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.2.1.1
    hooks:
      - id: buildifier
      - id: buildifier-lint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: "defcl/testdata/invalid/parser/whitespace/carriage_return.defcl"
      - id: name-tests-test
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --check
        language: system
        types_or: [markdown, yaml]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check --diff
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]

      - id: validate-proposals
        name: validate proposals
        entry: uv run python tools/validate_proposals.py
        language: system
        types: [markdown]
        files: ^(proposals|defcl/proposals)/(.*/)?\d{5}-.*\.md$

      - id: check-cursor-permissions
        name: check cursor permissions
        entry: uv run python tools/sync_cursor_permissions.py --check
        language: system
        files: ^\.claude/settings\.json$|^\.cursor/cli\.json$
        pass_filenames: false

      - id: buf-plugin-build
        name: build buf plugin
        entry: bash -c 'cd defcl/buf && go build -o buf-plugin-defcl .'
        language: system
        files: ^defcl/buf/.*\.go$|^defcl/.*\.proto$
        pass_filenames: false
  - repo: https://github.com/bufbuild/buf
    rev: v1.65.0
    hooks:
      - id: buf-lint
      - id: buf-format
