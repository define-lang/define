id: testdata-tests-use-sorted-diagnostics
language: python
severity: error
message:
  A data-backed test must assert on sorted_diagnostics(), not on an unsorted
  list of diagnostics or a load_failure.
note:
  sorted_diagnostics() returns every diagnostic of the program in a stable
  order, so asserting on it cannot miss a diagnostic or depend on the order
  that stages found them in.
files:
  - "**/*_test.py"
# Loading a project's config has no per-file diagnostics, and
# config-tests-unpack-every-diagnostic checks those tests instead.
ignores:
  - "define/compiler/config_tests/**"
rule:
  kind: function_definition
  has:
    field: parameters
    has:
      stopBy: end
      kind: identifier
      regex: ^(validate_testdata_structural|validate_testdata_structural_non_filesystem|validate_testdata_project_with_reference_graph|validate_testdata_non_filesystem_with_reference_graph|testdata_project_directory)$
  all:
    - has:
        stopBy: end
        any:
          - pattern: $_.diagnostics
          - pattern: $_.load_failure
