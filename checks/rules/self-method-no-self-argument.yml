id: self-method-no-self-argument
language: python
severity: error
message: >-
  Do not pass `self` or an attribute of `self` to a method of the same
  object; the method can read it from `self` itself. Fix it in the first of
  these ways that applies: (1) If the method always receives the same
  attribute, remove the parameter and read the attribute from `self` in the
  method. (2) If the method does not use `self`, make it a `@staticmethod`
  of the same class, or a module-level function, but only when its callers
  pass it different values; never make a method static to get around this
  check. (3) If the attribute was narrowed first, pass the narrowed value
  through a local name, with `case SomeType() as name:` in a `match` or a
  local assigned before an `is not None` check. Never assign an attribute to
  a local only to avoid this check.
files:
  - "**/*.py"
ignores:
  - vendored/**
rule:
  kind: call
  all:
    - has:
        field: function
        pattern: self.$METHOD
    - has:
        field: arguments
        kind: argument_list
        has:
          any:
            - regex: ^self(\.[A-Za-z_][A-Za-z0-9_]*)*$
              not:
                kind: keyword_argument
            - kind: keyword_argument
              has:
                field: value
                regex: ^self(\.[A-Za-z_][A-Za-z0-9_]*)*$
    # A static method does not read `self`, so it has to receive what it
    # uses. It may be defined in a base class of the caller's class, so any
    # class in the same file that defines it as a static method exempts it.
    - not:
        inside:
          kind: module
          stopBy: end
          has:
            kind: decorated_definition
            stopBy: end
            all:
              - has:
                  kind: decorator
                  regex: ^@staticmethod$
              - has:
                  field: definition
                  kind: function_definition
                  has:
                    field: name
                    pattern: $METHOD
