id: parser-tests-assert-error-location
language: python
severity: error
message:
  Assert every field of the expected syntax error's location (`line`, `column`,
  `end_line`, and `end_column`).
files:
  - define/compiler/parsing/parser_tests/*_test.py
rule:
  kind: function_definition
  any:
    # The test does not keep the error, so it cannot assert its location.
    - has:
        stopBy: end
        kind: expression_statement
        has:
          kind: call
          pattern: parse_syntax_error($$$)
    - all:
        - has:
            stopBy: end
            pattern: $ERROR = parse_syntax_error($$$)
        - any:
            - not:
                has:
                  stopBy: end
                  pattern: assert $ERROR.location.line == $LINE
            - not:
                has:
                  stopBy: end
                  pattern: assert $ERROR.location.column == $COLUMN
            - not:
                has:
                  stopBy: end
                  pattern: assert $ERROR.location.end_line == $END_LINE
            - not:
                has:
                  stopBy: end
                  pattern: assert $ERROR.location.end_column == $END_COLUMN
