id: parser-tests-use-parse-fixture
language: python
severity: error
message:
  Use the `parse` fixture, or `p` for the raw `ParseResult`, instead of
  constructing `parser.Parser`.
files:
  - define/compiler/parsing/parser_tests/*_test.py
rule:
  any:
    - pattern: parser.Parser($$$)
    - pattern: Parser($$$)
