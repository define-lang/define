id: parser-tests-specific-syntax-error
language: python
severity: error
message:
  Expect a specific subclass of `DefineSyntaxError`, not `DefineSyntaxError`
  itself.
files:
  - define/compiler/parsing/parser_tests/*_test.py
rule:
  pattern: isinstance($VALUE, $ERROR)
constraints:
  ERROR:
    any:
      - pattern: syntax_errors.DefineSyntaxError
      - pattern: DefineSyntaxError
