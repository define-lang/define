    # ZIP: Both keys are paths, compared segment by segment.
    for first, second in zip(first_key, second_key, strict=False):
        pass
  - |
    def pairs(views, types):
        # ZIP: The caller builds the types from the views, in their order,
        # so each type is at its view's position.
        for view, python_type in zip(views, types, strict=True):
            print(view, python_type)
