id: text-io-explicit-encoding
valid:
  - |
    path.read_text(encoding="utf-8")
  - |
    path.write_text(content, encoding="utf-8", newline="\n")
  - |
    open(name, encoding="utf-8")
  - |
    path.open("w", encoding="utf-8", newline="\n")
  - |
    path.open("rb")
  - |
    open(name, "wb")
  - |
    path.open("ab" if resumed else "wb")
  - |
    os.open(path, os.O_RDONLY)
  - |
    path.read_bytes()
invalid:
  - |
    path.read_text()
  - |
    path.write_text(content, newline="\n")
  - |
    open(name)
  - |
    open(name, "r")
  - |
    path.open()
  - |
    path.open("w", newline="\n")
  - |
    os.fdopen(descriptor, "w", newline="\n")
