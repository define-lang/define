id: parser-tests-assert-error-location
valid:
  - |
    def test_missing_terminator(parse_syntax_error):
        error = parse_syntax_error("define the potential position<standard:/x>\n")
        assert isinstance(error, syntax_errors.MissingTerminator)
        assert error.location.line == 1
        assert error.location.column == 44
        assert error.location.end_line == 1
        assert error.location.end_column == 44
  - |
    def test_missing_terminator(parse_syntax_error):
        syntax_error = parse_syntax_error(
            "define the potential position<standard:/x>\n"
        )
        assert syntax_error.location.line == 1
        assert syntax_error.location.column == 44
        assert syntax_error.location.end_line == 1
        assert syntax_error.location.end_column == 44
  - |
    def test_position_definition(parse):
        program = parse("define the potential position<standard:/x>.\n")
        assert program.definitions != ()
