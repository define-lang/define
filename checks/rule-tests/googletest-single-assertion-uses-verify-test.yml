id: googletest-single-assertion-uses-verify
valid:
  - |
    #[gtest]
    fn parses() -> Result<()> {
        verify_that!(parse("a"), eq(1))
    }
  - |
    #[gtest]
    fn parses_both() {
        expect_that!(parse("a"), eq(1));
        expect_that!(parse("b"), eq(2));
    }
  - |
    #[gtest]
    fn parses_schema() -> Result<()> {
        let schema = schema()?;
        expect_that!(parse("a", &schema), eq(1));
        Ok(())
    }
  - |
    fn helper() -> Result<()> {
        expect_that!(parse("a"), eq(1));
        Ok(())
    }
invalid:
  - |
    #[gtest]
    fn parses() -> Result<()> {
        expect_that!(parse("a"), eq(1));
        Ok(())
    }
  - |
    #[gtest]
    fn parses() {
        expect_that!(parse("a"), eq(1));
    }
  - |
    #[gtest]
    fn checks() -> Result<()> {
        expect_ok!(check(file()?));
        Ok(())
    }
