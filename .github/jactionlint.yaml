profile: pedantic
generated-files: report
config-secrets: [LOCKFILE_APP_PRIVATE_KEY]
config-variables: [LOCKFILE_APP_CLIENT_ID, TS_AUDIENCE, TS_OAUTH_CLIENT_ID]
rules:
  # Matches minimumReleaseAge in renovate.json5, so Renovate never proposes a
  # version that this rule rejects.
  action-release-cooldown:
    days: 2
  agentic-actions:
    any-trigger: true
  forbidden-uses:
    allow:
      - actions/cache/restore
      - actions/cache/save
      - actions/checkout
      - actions/create-github-app-token
      - actions/download-artifact
      - actions/upload-artifact
      - astral-sh/setup-uv
      - bazel-contrib/setup-bazel
      - bufbuild/buf-action
      - codecov/codecov-action
      - tailscale/github-action
  max-run-lines:
    max: 5
  timeout-too-long:
    max: 60
  unsound-prefix-match:
    refs: true
  unused-ignore:
    zizmor: true
  workflow-secret-scope:
    job-level: true
