name: Update MODULE.bazel.lock

on:
  push:
    branches:
      - "renovate/**"
    paths:
      - MODULE.bazel

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true

      - name: Update lockfile
        run: bazelisk mod deps --lockfile_mode=update

      - name: Commit and push via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet MODULE.bazel.lock && exit 0
          uv run python tools/git_commit_via_api.py "Update MODULE.bazel.lock" MODULE.bazel.lock
