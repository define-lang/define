name: Update MODULE.bazel.lock

on:
  push:
    branches:
      - "renovate/**"
    paths:
      - MODULE.bazel

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.14t

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true

      - name: Update lockfile
        run: bazelisk mod deps --lockfile_mode=update

      - name: Commit and push via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet MODULE.bazel.lock && exit 0
          uv run python tools/git_commit_via_api.py "Update MODULE.bazel.lock" MODULE.bazel.lock
