name: Update MODULE.bazel.lock

on:
  push:
    branches:
      - "renovate/**"
    paths:
      # Modules under local_path_override, such as vendored/re2, are part of the
      # root module's dependency graph.
      - "**/MODULE.bazel"
      # The crate extension records facts from Cargo.lock in MODULE.bazel.lock.
      - Cargo.lock

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Resolving dependencies runs code from the updated dependencies, so it happens
# in a job without write access. The job with write access runs no code from
# the repository.
jobs:
  compute-lockfile:
    name: Compute MODULE.bazel.lock
    if: ${{ github.actor == 'renovate[bot]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true

      - name: Update lockfile
        id: update
        run: |
          bazelisk mod deps --lockfile_mode=update
          changed=true
          git diff --quiet MODULE.bazel.lock && changed=false
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.update.outputs.changed == 'true' }}
        with:
          name: lockfile
          path: MODULE.bazel.lock
          if-no-files-found: error
          retention-days: 1

  commit-lockfile:
    name: Commit MODULE.bazel.lock
    environment: lockfile
    needs: compute-lockfile
    if: ${{ needs.compute-lockfile.outputs.changed == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The commit script comes from the default branch, which holds only
      # reviewed code, rather than from the Renovate branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: tools/git_commit_via_api.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lockfile

      # App commits trigger PR CI without the approval required for GITHUB_TOKEN.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.LOCKFILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOCKFILE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit lockfile
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python3 trusted/tools/git_commit_via_api.py "Update MODULE.bazel.lock"
          MODULE.bazel.lock
