name: Update MODULE.bazel.lock

on:
  push:
    branches:
      - "renovate/**"
    paths:
      - MODULE.bazel

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true

      - name: Update lockfile
        run: bazelisk mod deps --lockfile_mode=update

      - name: Commit and push via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet MODULE.bazel.lock && exit 0
          uv run python tools/git_commit_via_api.py "Update MODULE.bazel.lock" MODULE.bazel.lock
