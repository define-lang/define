name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  # Needed for the buf action to leave a comment explaining what's wrong.
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      # Run all tests (Python, Go, format, pyright, proposals, etc.)
      - name: Test
        run: bazelisk test --noshow_progress //...

      # Build any other target that didn't get built during testing.
      - name: Additional Build
        run: bazelisk build --noshow_progress //...

      - name: Format
        run: bazelisk run --noshow_progress //tools:format.check

      - uses: bufbuild/buf-action@v1
        with:
          breaking: false
          push: false
          format: false
