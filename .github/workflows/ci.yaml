name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

# Main keeps every run so each commit gets its own coverage upload. Grouping by
# branch lets CI on a lockfile commit cancel CI on the Renovate commit before
# it.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name ||
    github.repository }}:${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

defaults:
  run:
    shell: bash

jobs:
  coverage:
    name: Coverage
    if: >-
      ${{
        github.event.pull_request.user.login != 'renovate[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Authenticates the Codecov upload without a stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-coverage
          repository-cache: true

      - name: Coverage
        run: bazelisk coverage --noshow_progress --combined_report=lcov //...

      # Fork pull requests cannot get an OIDC token, and Codecov accepts their
      # uploads without one.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: bazel-out/_coverage/_coverage_report.dat
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os:
          - ubuntu-26.04
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true

      - name: Test
        run: bazelisk test --noshow_progress //...

      - name: Additional Build
        run: bazelisk build --noshow_progress //...

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.14t

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # This must run before any other Bazel command, which would silently
      # update a stale lockfile.
      - name: Check that MODULE.bazel.lock is up to date
        run: bazelisk mod deps --noshow_progress --lockfile_mode=error

      - name: Format
        run: bazelisk run --noshow_progress //:format -- --check --all

      - name: Check Python BUILD dependencies
        run: uv run tools/check_python_deps.py --check

      # The ast-grep lint aspect only sees build targets' sources, so BUILD files
      # need their own scan.
      - name: Check BUILD files with ast-grep
        run: >-
          bazelisk run --noshow_progress @multitool//tools/ast-grep:cwd -- scan
          --globs '**/BUILD.bazel'

      - name: Check for broken symlinks
        run: uv run tools/check_symlinks.py

      - name: Check GitHub Actions against the GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bazelisk run --noshow_progress //.github:jactionlint_online

      - name: Build buf plugin
        run: bazelisk build --noshow_progress //defcl/buf

      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          breaking: false
          format: false
          pr_comment: false
          push: false
