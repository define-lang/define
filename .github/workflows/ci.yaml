name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

# Main keeps every run so each commit gets its own coverage upload. Grouping by
# branch lets CI on a lockfile commit cancel CI on the Renovate commit before
# it.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name ||
    github.repository }}:${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

defaults:
  run:
    shell: bash

jobs:
  coverage:
    name: Coverage
    if: >-
      ${{
        github.event.pull_request.user.login != 'renovate[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Authenticates the Codecov upload without a stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # target-cpu=native produces CPU-specific Rust code. Runners with the same
      # OS can have different CPUs, so even fallback cache restores must match
      # the CPU model and features to avoid illegal-instruction crashes.
      - &cpu-cache
        name: Identify CPU for the build cache
        id: cpu
        run: python3 tools/cpu_fingerprint.py >> "$GITHUB_OUTPUT"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-coverage-cpu-v1-${{ steps.cpu.outputs.fingerprint }}
          repository-cache: true

      - name: Coverage
        run: bazelisk coverage --noshow_progress --combined_report=lcov //...

      # Fork pull requests cannot get an OIDC token, and Codecov accepts their
      # uploads without one.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: bazel-out/_coverage/_coverage_report.dat
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os:
          - ubuntu-26.04
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *cpu-cache

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-cpu-v1-${{ steps.cpu.outputs.fingerprint }}
          repository-cache: true

      - name: Test
        run: bazelisk test --noshow_progress //...

      - name: Additional Build
        run: bazelisk build --noshow_progress //...

  windows-cross:
    name: Windows cross build
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *cpu-cache

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-windows-cross-cpu-v1-${{ steps.cpu.outputs.fingerprint }}
          repository-cache: true

      - name: Build
        run: bazelisk build --noshow_progress --config=windows_cross //...

  # Windows tests run in two jobs at once: this one builds on Linux with
  # --config=windows_vm, and windows-test-runner serves remote execution for its
  # tests on Windows, with the rbe that windows-rbe builds. Runners accept no incoming connections, so they meet on a
  # tailnet used only for CI. Fork pull requests get no OIDC token to join it.
  windows-tests:
    name: Windows tests
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Joins the CI tailnet.
    env:
      WINDOWS_HOSTNAME: ci-windows-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Joining first means fewer failures can stop this job before it tells
      # the Windows test runner to stop.
      - name: Join the CI tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *cpu-cache

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-windows-tests-cpu-v1-${{ steps.cpu.outputs.fingerprint }}
          repository-cache: true

      - name: Make the bazel_tools that Windows tests need
        run: bazelisk run --noshow_progress //tools/windows_vm:bazel_tools_override

      # Bazel fails at startup if it cannot reach the remote executor.
      - name: Wait for the Windows test runner
        timeout-minutes: 15
        run: |
          address=$(.github/scripts/wait_for_windows_test_runner.sh "$WINDOWS_HOSTNAME")
          echo "WINDOWS_ADDRESS=$address" >> "$GITHUB_ENV"

      - name: Test
        run: >-
          bazelisk test --noshow_progress --config=windows_vm
          "--remote_executor=grpc://$WINDOWS_ADDRESS:8980" //...

      - name: Tell the Windows test runner that this job finished
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "$JOB_STATUS" | nc -N -w 10 "$WINDOWS_ADDRESS" 8981

  windows-rbe:
    name: Build rbe for Windows
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *cpu-cache

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-windows-rbe-cpu-v1-${{ steps.cpu.outputs.fingerprint }}
          repository-cache: true

      - name: Build rbe
        run: bazelisk build --noshow_progress --config=windows_cross //tools/rbe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbe
          path: bazel-bin/tools/rbe/rbe_/rbe.exe
          if-no-files-found: error
          retention-days: 1

  windows-test-runner:
    name: Windows test runner
    needs: windows-rbe
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Joins the CI tailnet.
    env:
      WINDOWS_HOSTNAME: ci-windows-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rbe
          path: ${{ runner.temp }}

      - name: Join the CI tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          hostname: ${{ env.WINDOWS_HOSTNAME }}-starting

      - name: Serve tests until the Windows tests job finishes
        run: >-
          .github/scripts/serve_windows_tests.ps1 -Rbe "$env:RUNNER_TEMP\rbe.exe"
          -Root "$env:RUNNER_TEMP\rbe" -Port 8980 -StatusPort 8981
          -ReadyHostname $env:WINDOWS_HOSTNAME

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: 3.14t

      - *cpu-cache

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-lint-cpu-v1-${{ steps.cpu.outputs.fingerprint }}
          repository-cache: true

      # This must run before any other Bazel command, which would silently
      # update a stale lockfile.
      - name: Check that MODULE.bazel.lock is up to date
        run: bazelisk mod deps --noshow_progress --lockfile_mode=error

      - name: Format
        run: bazelisk run --noshow_progress //:format -- --check --all

      - name: Check Python BUILD dependencies
        run: uv run tools/check_python_deps.py --check

      # The ast-grep lint aspect only sees build targets' sources, so BUILD files
      # need their own scan.
      - name: Check BUILD files with ast-grep
        run: >-
          bazelisk run --noshow_progress @multitool//tools/ast-grep:cwd -- scan
          --globs '**/BUILD.bazel'

      - name: Check for broken symlinks
        run: uv run tools/check_symlinks.py

      - name: Check GitHub Actions against the GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bazelisk run --noshow_progress //.github:jactionlint_online

      - name: Build buf plugin
        run: bazelisk build --noshow_progress //defcl/buf

      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          breaking: false
          format: false
          pr_comment: false
          push: false
