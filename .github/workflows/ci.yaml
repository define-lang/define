name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      # Run all tests (Python, Go, format, pyright, proposals, etc.)
      - name: Test
        run: bazelisk test //...

      # Build any other target that didn't get built during testing.
      - name: Additional Build
        run: bazelisk build //...

      # --- Non-Bazel checks ---
      - name: Prettier
        run: npx prettier --check "**/*.md" "**/*.yaml"

      - name: Buildifier
        run: npx @bazel/buildifier -mode=diff -lint=warn -r .

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # The Bazel build already produced the plugin at bazel-bin/defcl/buf/buf_/buf
      # which is referenced by buf.yaml
      - name: Buf Lint
        run: buf lint

      - name: Buf Format
        run: buf format --diff --exit-code
