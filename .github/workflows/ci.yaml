name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  # Needed for the buf action to leave a comment explaining what's wrong.
  pull-requests: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true

      - name: Test
        run: bazelisk test --noshow_progress //...

      - name: Additional Build
        run: bazelisk build --noshow_progress //...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Format
        run: bazelisk run --noshow_progress //tools:format.check

      - uses: bufbuild/buf-action@v1
        with:
          breaking: false
          push: false
          format: false
