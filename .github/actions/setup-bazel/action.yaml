name: Set up Bazel
description: Sets up Bazel with a disk cache shared by compatible CPUs.
inputs:
  cache-name:
    description: Distinguishes this job's disk cache from other jobs' caches.
    required: true
runs:
  using: composite
  steps:
    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ inputs.cache-name }}-cpu-baseline-v1-${{ runner.arch }}
        repository-cache: true
