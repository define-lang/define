name: Set up Bazel
description: Sets up Bazel with a disk cache that only runners with the same CPU share.
inputs:
  cache-name:
    description: Distinguishes this job's disk cache from other jobs' caches.
    required: true
runs:
  using: composite
  steps:
    # target-cpu=native produces CPU-specific Rust code. Runners with the same
    # OS can have different CPUs, so even fallback cache restores must match
    # the CPU model and features to avoid illegal-instruction crashes.
    - name: Identify CPU for the build cache
      id: cpu
      shell: bash
      run: python3 tools/cpu_fingerprint.py >> "$GITHUB_OUTPUT"

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ inputs.cache-name }}-cpu-v2-${{ steps.cpu.outputs.fingerprint }}
        repository-cache: true
