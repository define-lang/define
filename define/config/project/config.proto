edition = "2024";

package define.config.project;

import "buf/validate/validate.proto";
import "defcl/schema/core/boolean.proto";

// Top-level wrapper for .define/project/config.defcl files.
message ProjectConfigFile {
  // The project configuration.
  Project project = 1;
}

// Configuration for a Define project.
message Project {
  // The fully-qualified universe name (FQUN) for this project.
  string universe_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Which association configuration files the project has.
  Associations associations = 2;
}

// Which association configuration files a project has.
message Associations {
  // Whether the project has .define/encodings/encodings.defcl.
  defcl.schema.core.Defcl.Boolean has_encodings = 1;

  // Whether the project has .define/encodings/encoding_operations.defcl.
  defcl.schema.core.Defcl.Boolean has_encoding_operations = 2;
}
