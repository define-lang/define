edition = "2024";

package define.config.encodings;

import "buf/validate/validate.proto";

// Top-level wrapper for .define/encodings/encoding_operations.defcl files.
message EncodingOperationsFile {
  // The project's Encoding Operation associations.
  EncodingOperations encoding_operations = 1;
}

// Wrapper for the repeated operation encoding field.
message EncodingOperations {
  // The associations between the project's Abstract Operations and Encoding
  // Operations. Every logical_operation comes before any operation, and each
  // group is sorted by name. Each pair must be unique (enforced at load time,
  // not by proto validation).
  repeated OperationEncoding operation_encodings = 1;
}

// Declares that an Encoding Operation potentially performs an Abstract
// Operation: a logical operation or a Value Operation.
message OperationEncoding {
  // The Abstract Operation. Each field's name is the name type of the
  // Abstract Operation that it names.
  oneof abstract_operation {
    option (buf.validate.oneof).required = true;

    // The short global name of a logical operation in the same universe as
    // the project. The compiler parses it as Define parses a global name.
    string logical_operation = 1;

    // The short global name of a Value Operation in the same universe as the
    // project. The compiler parses it as Define parses a global name.
    string operation = 2;
  }

  // The Encoding Operation that potentially performs the Abstract Operation.
  EncodingOperation encoding_operation = 3 [(buf.validate.field).required = true];
}

// Which Encoding Operation an association names: its name and the encodings of
// its Interface Views, so that the compiler can choose it without loading it.
// The compiler checks the views against the Encoding Operation when it loads
// it.
message EncodingOperation {
  // The global name of the Encoding Operation: a short global name for an
  // Encoding Operation in the project's own universe, or a fully-qualified
  // global name for one in another universe. The compiler parses it as Define
  // parses a global name.
  string name = 1 [(buf.validate.field).required = true];

  // The Encoding Operation's Interface Views, in order, with the encoding that
  // each one is assigned.
  repeated ViewEncoding views = 2 [(buf.validate.field).repeated.min_items = 1];
}

// One Interface View of an associated Encoding Operation and its encoding.
message ViewEncoding {
  // The local name of the Interface View.
  string view = 1 [(buf.validate.field).required = true];

  // The global name of the encoding assigned to the view: a short global name
  // for an encoding in the project's own universe, or a fully-qualified global
  // name for one in another universe. The compiler parses it as Define parses
  // a global name.
  string encoding = 2 [(buf.validate.field).required = true];
}
