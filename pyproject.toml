[project]
name = "define"
version = "0.0.1"
description = "A programming language based in epistemology (the study of how knowledge is known)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,!=8.3.0,!=8.3.1",
    # 3 is the first Python 3-only series
    "lark-cython",
    "msgspec",
    # 6.31 is the first version with FieldDescriptor.is_repeated
    "protobuf>=6.31",
    # 1.1.2 is the first version to support protobuf v7
    "protovalidate>=1.1.2",
]

[tool.ruff.lint]
select = ["ALL"]
preview = true
explicit-preview-rules = true
ignore = [
  # Return annotations, including `-> None`, which this project omits.
  "ANN201",
  "ANN202",
  "ANN204",
  "ANN205",
  # Size and complexity limits with arbitrary thresholds.
  "C901",
  "CPY001", # Files do not carry copyright notices.
  # Conflict with the ruff formatter.
  "COM812",
  "ISC001",
  # These docstring layouts conflict with D211 and D212, respectively.
  "D203",
  "D213",
  "D413", # A blank line before closing docstring quotes adds no value here.
  # Project docstrings do not use Returns, Yields, or Raises sections.
  "DOC201",
  "DOC402",
  "DOC501",
  "DOC502",
  # The formatter owns line length, and Define source is never split across
  # Python lines.
  "E501",
  "ERA001", # Its heuristic flags example and descriptive comments as code.
  # Exception message style.
  "EM",
  "TRY003",
  # TODO comments are allowed and need no author or issue link.
  "FIX002",
  "TD",
  # Source directories do not all have `__init__.py`.
  "INP001",
  "ISC003", # Explicit string concatenation is allowed.
  "PERF401", # Loops are preferred over comprehensions that are not simple.
  "PLC1901", # Explicit empty-string comparisons distinguish other falsey values.
  "PLR2004", # Tests compare against literal values.
  "PTH201", # Keep the existing current-directory path style until B5 is decided.
  "RUF105", # Existing noqa comments need no Ruff-specific replacement.
  "RUF201", # Rule codes are allowed in Ruff selectors.
  "S404", # Tooling deliberately imports subprocess to run commands.
]
extend-select = [
  "D421", # Describe properties as values rather than actions.
  "PLR0904", # Enforce size limits in vibe-coded sources; others opt out below.
  "PLR0914",
  "PLR0916",
  "PLW0717",
  "RUF031", # Parenthesize tuple subscripts.
  "RUF052", # Flag local variables that are named as unused but then accessed.
  "RUF067", # Keep handwritten package initializers free of executable definitions.
  "W",  # pycodestyle warnings
  "I",  # isort
  "N",  # pep8-naming
  "D",  # pydocstyle
  "UP", # pyupgrade
  "C4",  # flake8-comprehensions
  "B",   # flake8-bugbear
  "BLE", # flake8-blind-except
  "FBT", # flake8-boolean-trap
  "A",   # flake8-builtins
  "S",   # flake8-bandit
  "LOG", # flake8-logging
  "G",   # flake8-logging-format
  "TCH", # flake8-type-checking
  "ICN", # flake8-import-conventions
  "SIM", # flake8-simplify
  "PT",  # flake8-pytest-style
  "YTT", # flake8-2020
  "PIE", # flake8-pie
  "RET", # flake8-return
  "ARG", # flake8-unused-arguments
  "DTZ", # flake8-datetimez
  "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["define", "defcl", "tools"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
allow-magic-value-types = []

[tool.ruff.lint.ruff]
parenthesize-tuple-in-subscript = true

[tool.ruff.lint.extend-per-file-ignores]
"!{checks/**,tools/**,define/compiler/driver_fuzz_test.py}" = [
    "PLR09", # Size limits apply to the vibe-coded sources above.
    "PLW0717", # The same scope applies to the try-clause size limit.
]
"**/*.py" = [
    "S603", # Allow subprocess calls without a shell.
]
"tools/**/*.py" = [
    "T201", # Command-line tools print their output.
]
"tools/profiler/testdata/*_target.py" = [
    "PTH", # Profiler targets are test data.
]
"define/compiler/**/*.py" = [
    "S105", # Stop complaining about assigning things to "token"
]
"**/testdata/**/expected/**/*.py" = [
    "A001", # Generated class names may intentionally match Python built-ins.
    "D100", # Generated code doesn't need module docstrings.
    "D101", # Generated code doesn't need class docstrings.
    "D102", # Generated code doesn't need method docstrings.
    "D103", # Generated code doesn't need function docstrings.
    "D107", # Generated code doesn't need __init__ docstrings.
    "FBT001", # Encoding Operation functions take boolean values positionally, like any other value.
    "FBT003", # Boolean literals are passed to Encoding Operation functions positionally, like any other value.
    "I001", # Import ordering depends on isort first-party config of the target project.
    "I002", # Generated code does not inherit this project's required imports.
    "N801", # Generated code may produce non-CapWords class names.
    "RUF052", # Generated names preserve the source program's identifiers.
    "RUF067", # Generated code is emitted into package `__init__.py` modules.
]
"**/testdata/**/expected_trace/**/*.py" = [
    "A001", # Generated class names may intentionally match Python built-ins.
    "D100", # Generated code doesn't need module docstrings.
    "D101", # Generated code doesn't need class docstrings.
    "D102", # Generated code doesn't need method docstrings.
    "D103", # Generated code doesn't need function docstrings.
    "D107", # Generated code doesn't need __init__ docstrings.
    "FBT001", # Encoding Operation functions take boolean values positionally, like any other value.
    "FBT003", # Boolean literals are passed to Encoding Operation functions positionally, like any other value.
    "I001", # Import ordering depends on isort first-party config of the target project.
    "I002", # Generated code does not inherit this project's required imports.
    "N801", # Generated code may produce non-CapWords class names.
    "RUF052", # Generated names preserve the source program's identifiers.
    "RUF067", # Generated code is emitted into package `__init__.py` modules.
]
"**/*_test.py" = [
    "S101", # Allow assert statements.
    "D100", # Don't require docstrings on test modules.
    "D101", # Don't require docstrings on test classes.
    "D102", # Don't require docstrings on test methods.
    "D103", # Don't require docstrings on test functions.
    "SLF001", # Tests may exercise private helpers.
]
"**/conftest.py" = [
    "S101", # Allow assert statements.
]
"**/test_helpers.py" = [
    "S101", # Allow assert statements in test helpers.
]
"define/compiler/errors/parser_exceptions.py" = [
    "N818", # Allow exceptions that are not suffixed with "Error", for the parser.
]
"define/compiler/ast.py" = [
    "A005", # Module intentionally named ast for AST definitions.
]
[tool.ruff]
extend-exclude = ["vendored"]
force-exclude = true

[tool.ruff.format]
exclude = [
    "**/testdata/**/expected/**/*.py",
    "**/testdata/**/expected_trace/**/*.py",
]

[tool.pytest.ini_options]
addopts = "--tb=short --no-header -q"
junit_logging = "all"
norecursedirs = [
    "bazel-*",
    "experimental",
    "mutants",
]

[tool.mutmut]
source_paths = [
    "defcl/python/",
    "define/compiler/",
    "define/runtime/",
]
also_copy = [
    "buf",
    "defcl/testdata",
    "define/config",
    "define/reserved_words",
    "define/testdata",
]
do_not_mutate = [
    "*_test.py",
    "*_pb2.py",
    "**/conftest.py",
    "**/test_helpers.py",
    "**/testdata/**",
    "defcl/python/lark/lark_standalone.py",
    "define/compiler/parsing/lark/lark_standalone.py",
]
pytest_add_cli_args_test_selection = [
    "defcl/python",
    "define/compiler",
    "define/runtime",
]
pytest_add_cli_args = [
    # These tests execute subprocesses, which do not exercise mutmut's
    # in-process mutated code and therefore provide no mutation coverage.
    "--ignore=define/compiler/codegen/callee_codegen_independence_integration_test.py",
    "--ignore=define/compiler/driver_fuzz_test.py",
    "--ignore=define/compiler/driver_integration_test.py",
    "--ignore=define/compiler/main_integration_test.py",
    "--deselect=define/compiler/codegen/tracing_integration_test.py::test_generated_trace_matches_expected_artifacts",
    "--deselect=define/compiler/codegen/tracing_integration_test.py::test_concurrent_runtime_respects_resolved_operation_dependencies",
    "--deselect=define/compiler/codegen/generator_integration_test.py::test_expected_output_runs",
]

[tool.coverage.run]
branch = true

[tool.uv.sources]
lark-cython = { git = "https://github.com/define-lang/lark_cython", rev = "a524058a4336e9af3eb4223e24fbc65dbe4847d5" }
google-re2 = { path = "vendored/re2/python", package = false }

[tool.basedpyright]
# Do not disable any rules here. Fix type errors in source code instead.
stubPath = "typestubs"
exclude = [
    "experimental",
    "vendored",
    ".venv",
    "**/.*.venv",
    "bazel-*",
    "**/*.pytest_main.py",
    "defcl/python/lark",
    "define/compiler/parsing/lark",
]

[[tool.basedpyright.executionEnvironments]]
root = "define/testdata/codegen"
extraPaths = ["."]
reportImplicitRelativeImport = false

[[tool.basedpyright.executionEnvironments]]
root = "define/testdata/reference_graph"
extraPaths = ["."]
reportImplicitRelativeImport = false

[[tool.basedpyright.executionEnvironments]]
root = "define/testdata/structural"
extraPaths = ["."]
reportImplicitRelativeImport = false

[dependency-groups]
default = [
    "define",
]
dev = [
    # Keep Bazel's dev venv broad enough for build/test tooling plus runtime deps.
    "define",
    "build",
    "coverage",
    "cython>=3.3.0,<3.4",
    # Directly declared so uv uses the Bazel-provided virtual package.
    "google-re2",
    "hypothesis",
    "lark",
    "mutmut",
    "pre-commit",
    "pygithub",
    "pytest>=6",
    "pyyaml",
    "requests",
    "ruff",
    "setuptools",
    "types-protobuf",
    "types-pyyaml",
]
