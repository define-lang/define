[project]
name = "define"
version = "0.0.1"
description = "A programming language based in epistemology (the study of how knowledge is known)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lark",
]

[tool.ruff.lint]
extend-select = [
  "W",  # pycodestyle warnings
  "I",  # isort
  "N",  # pep8-naming
  "D",  # pydocstyle
  "UP", # pyupgrade
  "C4",  # flake8-comprehensions
  "B",   # flake8-bugbear
  "BLE", # flake8-blind-except
  "FBT", # flake8-boolean-trap
  "A",   # flake8-builtins
  "S",   # flake8-bandit
  "LOG", # flake8-logging
  "G",   # flake8-logging-format
  "TCH", # flake8-type-checking
  "ICN", # flake8-import-conventions
  "SIM", # flake8-simplify
  "PT",  # flake8-pytest-style
  "YTT", # flake8-2020
  "PIE", # flake8-pie
  "RET", # flake8-return
  "ARG", # flake8-unused-arguments
  "DTZ", # flake8-datetimez
  "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.extend-per-file-ignores]
"**/*.py" = [
    "S603", # Allow subprocess calls without a shell.
]
"**/*_test.py" = [
    "S101", # Allow assert statements.
    "D100", # Don't require docstrings on test modules.
    "D101", # Don't require docstrings on test classes.
    "D102", # Don't require docstrings on test methods.
    "D103", # Don't require docstrings on test functions.
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
junit_logging = "all"

[tool.pyright]
exclude = ["experimental", ".venv"]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright[nodejs]",
    "pytest>=6",
    "requests",
    "ruff",
]
