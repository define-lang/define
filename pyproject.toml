[project]
name = "define"
version = "0.0.1"
description = "A programming language based in epistemology (the study of how knowledge is known)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,!=8.3.0,!=8.3.1",
    # 3 is the first Python 3-only series
    "jinja2>=3",
    # 6.31 is the first version with FieldDescriptor.is_repeated
    "protobuf>=6.31",
    # 1.1.2 is the first version to support protobuf v7
    "protovalidate>=1.1.2",
    "pygtrie",
    "regex",
]

[tool.ruff.lint]
extend-select = [
  "W",  # pycodestyle warnings
  "I",  # isort
  "N",  # pep8-naming
  "D",  # pydocstyle
  "UP", # pyupgrade
  "C4",  # flake8-comprehensions
  "B",   # flake8-bugbear
  "BLE", # flake8-blind-except
  "FBT", # flake8-boolean-trap
  "A",   # flake8-builtins
  "S",   # flake8-bandit
  "LOG", # flake8-logging
  "G",   # flake8-logging-format
  "TCH", # flake8-type-checking
  "ICN", # flake8-import-conventions
  "SIM", # flake8-simplify
  "PT",  # flake8-pytest-style
  "YTT", # flake8-2020
  "PIE", # flake8-pie
  "RET", # flake8-return
  "ARG", # flake8-unused-arguments
  "DTZ", # flake8-datetimez
  "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["define", "defcl", "tools"]

[tool.ruff.lint.extend-per-file-ignores]
"**/*.py" = [
    "S603", # Allow subprocess calls without a shell.
]
"define/compiler/**/*.py" = [
    "S105", # Stop complaining about assigning things to "token"
]
"**/*_test.py" = [
    "S101", # Allow assert statements.
    "D100", # Don't require docstrings on test modules.
    "D101", # Don't require docstrings on test classes.
    "D102", # Don't require docstrings on test methods.
    "D103", # Don't require docstrings on test functions.
]
"**/conftest.py" = [
    "S101", # Allow assert statements.
]
"define/compiler/parser_exceptions.py" = [
    "N818", # Allow exceptions that are not suffixed with "Error", for the parser.
]
"define/compiler/ast.py" = [
    "A005", # Module intentionally named ast for AST definitions.
]
"**/codegen/testdata/**/*.py" = [
    "D100", # Generated code doesn't need module docstrings.
    "D101", # Generated code doesn't need class docstrings.
    "D102", # Generated code doesn't need method docstrings.
    "D103", # Generated code doesn't need function docstrings.
    "D107", # Generated code doesn't need __init__ docstrings.
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
junit_logging = "all"
norecursedirs = [
    "bazel-*",
    "experimental",
    "mutants",
]

[tool.mutmut]
paths_to_mutate = [
    "defcl/python/",
    "define/compiler/",
]
also_copy = [
    "buf",
    "defcl/testdata",
    "define/config",
    "define/reserved_words",
    "define/testdata",
]
do_not_mutate = [
    "*_test.py",
    "*_pb2.py",
    "**/conftest.py",
    "**/test_helpers.py",
    "defcl/python/lark/lark_standalone.py",
    "define/compiler/lark/lark_standalone.py",
]
pytest_add_cli_args_test_selection = [
    "defcl/python",
    "define/compiler",
]
pytest_add_cli_args = [
    "--ignore=define/compiler/driver_fuzz_test.py",
    "--ignore=define/compiler/driver_integration_test.py",
]

[tool.basedpyright]
# Do not disable any rules here. Fix type errors in source code instead.
stubPath = "typestubs"
exclude = [
    "experimental",
    ".venv",
    "bazel-*",
    "**/*.pytest_main.py",
    "defcl/python/lark",
    "define/compiler/lark",
]

[dependency-groups]
default = [
    "define",
]
dev = [
    # Keep Bazel's dev venv broad enough for build/test tooling plus runtime deps.
    "define",
    "build",
    "coverage",
    "hypothesis",
    "j2lint",
    "lark",
    "mutmut",
    "pre-commit",
    "pygithub",
    "pytest>=6",
    "pyyaml",
    "requests",
    "ruff",
    "setuptools",
    "types-protobuf",
    "types-pyyaml",
]
