[workspace]
members = ["define"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.99"

[workspace.dependencies]
askama = "=0.16.1"
derive_more = { version = "=2.1.1", features = ["display", "error"] }
googletest = "=0.14.4"
prost = "=0.14.4"
prost-types = "=0.14.4"
protoc-gen-prost = "=0.5.0"
pyo3 = { version = "=0.30.1", features = [
  "experimental-inspect",
  "extension-module",
] }
rustc-hash = "=2.1.3"
serde_json = "=1.0.154"
strum = { version = "=0.28.0", features = ["derive"] }
wide = "=1.7.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
dbg_macro = "deny"
# The parser inlines its hot paths on purpose.
inline_always = "allow"
# The code writes pub(crate) to say what each item's visibility is meant to be,
# even where a private module already limits it to the crate.
redundant_pub_crate = "allow"
# A match on an Option shows each case with its own arm, which reads more
# clearly than map_or_else's two closures, None's first.
option_if_let_else = "allow"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
