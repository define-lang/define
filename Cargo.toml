[workspace]
members = ["define"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.99"

[workspace.dependencies]
askama = "=0.16.1"
googletest = "=0.14.4"
pyo3 = { version = "=0.30.1", features = [
  "experimental-inspect",
  "extension-module",
] }
rustc-hash = "=2.1.3"
serde_json = "=1.0.154"
wide = "=1.7.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
