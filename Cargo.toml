[workspace]
members = ["define"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.99"

[workspace.dependencies]
askama = "=0.16.1"
pyo3 = { version = "=0.30.1", features = ["extension-module"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
