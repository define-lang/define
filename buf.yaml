version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: defcl
    # Bazel's proto_library resolves the test schemas' imports from the
    # repository root, not from this module.
    excludes:
      - defcl/testdata
  - path: define
lint:
  use:
    - STANDARD
    - COMMENTS
    - DEFCL
  except:
    - ENUM_VALUE_PREFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  enum_zero_value_suffix: UNSPECIFIED
  ignore:
    - defcl/buf/testdata
plugins:
  - plugin: bazel-bin/defcl/buf/buf_/buf
