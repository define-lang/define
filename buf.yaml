version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  # The repository root, so that imports have the paths that Bazel's
  # proto_library resolves, and schemas in define can import defcl's. Only
  # the schema directories are included, so buf does not walk the whole
  # repository.
  - path: .
    includes:
      - defcl/schema
      - define/config
  # The buf plugin's test schemas import each other from defcl.
  - path: defcl
    excludes:
      - defcl/schema
      - defcl/testdata
lint:
  use:
    - STANDARD
    - COMMENTS
    - DEFCL
  except:
    - ENUM_VALUE_PREFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  enum_zero_value_suffix: UNSPECIFIED
  ignore:
    - defcl/buf/testdata
plugins:
  - plugin: bazel-bin/defcl/buf/buf_/buf
