version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: defcl/schema
  - path: define/config
lint:
  use:
    - STANDARD
    - COMMENTS
    - DEFCL
  except:
    - ENUM_VALUE_PREFIX
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
  enum_zero_value_suffix: UNSPECIFIED
plugins:
  - plugin: bazel-bin/defcl/buf/buf_/buf
